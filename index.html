<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0b0b10">
  <title>Parkour 3D - Akses</title>
  
  <link rel="manifest" href="./manifest.json">
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@500;700&family=Baloo+2:wght@600;800&display=swap');

    * { box-sizing: border-box; }
    body { 
      margin: 0; padding: 0; background: #0b0b10; font-family: 'Rajdhani', sans-serif; 
      user-select: none; -webkit-user-select: none; color: white;
      display: flex; justify-content: center; align-items: center; 
      min-height: 100vh; overflow-y: auto; overflow-x: hidden;
    }

    /* --- UI LOGIN --- */
    :root {
      --auth-bg: #0b0b10;
      --auth-surface: #13131a;
      --auth-field: #0f0f15;
      --auth-border: #262632;
      --auth-border-strong: #3a3a4a;
      --auth-text: #ececf1;
      --auth-muted: #8b8b9a;
      --auth-accent: #8257e6;
      --auth-accent-hover: #9368f0;
      --auth-danger: #f87171;
      --auth-ok: #4ade80;
      --auth-font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    #auth-container {
      width: 100%; max-width: 400px; padding: 24px 20px; z-index: 100;
      display: flex; flex-direction: column; align-items: stretch; gap: 22px;
      font-family: var(--auth-font); color: var(--auth-text);
    }

    .brand { display: flex; align-items: center; gap: 14px; }
    .brand-mark { width: 46px; height: 46px; flex: none; border-radius: 12px; background: var(--auth-accent); display: flex; align-items: center; justify-content: center; }
    .brand-mark svg { width: 26px; height: 26px; fill: #fff; }
    .brand-text h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: .02em; line-height: 1.2; color: var(--auth-text); }
    .brand-text p { margin: 3px 0 0; font-size: 13px; color: var(--auth-muted); }

    .auth-card { background: var(--auth-surface); border: 1px solid var(--auth-border); border-radius: 16px; padding: 22px; }
    .auth-heading { margin: 0 0 4px; font-size: 18px; font-weight: 600; }
    .auth-sub { margin: 0 0 18px; font-size: 13px; color: var(--auth-muted); line-height: 1.5; }

    .tabs { position: relative; display: grid; grid-template-columns: 1fr 1fr; padding: 3px; margin-bottom: 20px; background: var(--auth-field); border: 1px solid var(--auth-border); border-radius: 10px; z-index: 999; }
    .tabs input[type="radio"], #tab1, #tab2 { display: none; }
    .tab-indicator { position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc(50% - 3px); background: #22222d; border: 1px solid var(--auth-border-strong); border-radius: 7px; transition: transform .22s ease; }
    .tab-label { position: relative; text-align: center; padding: 9px 0; font-size: 14px; font-weight: 600; color: var(--auth-muted); cursor: pointer; transition: color .2s; }
    #tab1:checked ~ .auth-card .tab-label[for="tab1"], #tab2:checked ~ .auth-card .tab-label[for="tab2"] { color: var(--auth-text); }
    #tab2:checked ~ .auth-card .tab-indicator { transform: translateX(100%); }

    .form-container { width: 100%; position: relative; z-index: 1; }
    .form-box { width: 100%; display: none; flex-direction: column; }
    #tab1:checked ~ .auth-card .form-container #form-login { display: flex; }
    #tab2:checked ~ .auth-card .form-container #form-register { display: flex; }

    .input-group { margin-bottom: 14px; }
    .input-group label { display: block; font-size: 13px; font-weight: 500; color: #c4c4cf; margin-bottom: 6px; }
    .input-wrapper { display: flex; align-items: center; gap: 10px; height: 46px; background: var(--auth-field); border: 1px solid var(--auth-border); border-radius: 10px; padding: 0 12px; transition: border-color .15s, box-shadow .15s; }
    .input-wrapper:hover { border-color: var(--auth-border-strong); }
    .input-wrapper:focus-within { border-color: var(--auth-accent); box-shadow: 0 0 0 3px rgba(130, 87, 230, .18); }
    .input-wrapper .icon { width: 18px; height: 18px; flex: none; color: var(--auth-muted); transition: color .15s; }
    .input-wrapper:focus-within .icon { color: var(--auth-accent-hover); }
    .input-wrapper input { flex: 1; min-width: 0; height: 100%; background: transparent; border: none; outline: none; color: var(--auth-text); font-family: var(--auth-font); font-size: 15px; user-select: text; -webkit-user-select: text; }
    .input-wrapper input::placeholder { color: #5b5b6a; }
    .toggle-pw { flex: none; width: 30px; height: 30px; margin-right: -6px; display: flex; align-items: center; justify-content: center; background: transparent; border: none; border-radius: 6px; color: var(--auth-muted); cursor: pointer; }
    .toggle-pw:hover { color: var(--auth-text); background: rgba(255,255,255,.05); }
    .toggle-pw svg { width: 18px; height: 18px; }
    .toggle-pw .eye-off { display: none; }
    .toggle-pw.is-visible .eye { display: none; }
    .toggle-pw.is-visible .eye-off { display: block; }
    .field-hint { margin: 6px 0 0; font-size: 12px; color: var(--auth-muted); }

    .btn-submit { width: 100%; height: 46px; margin-top: 6px; border: none; border-radius: 10px; background: var(--auth-accent); color: #fff; font-family: var(--auth-font); font-size: 15px; font-weight: 600; cursor: pointer; transition: background .15s, transform .1s; }
    .btn-submit:hover { background: var(--auth-accent-hover); }
    .btn-submit:active { transform: scale(0.98); }
    .btn-submit:disabled { background: #2a2a35; color: #6b6b7a; cursor: not-allowed; transform: none; }

    .msg { min-height: 20px; margin-top: 12px; font-size: 13px; line-height: 1.4; text-align: center; font-weight: 500; }
    .msg.error { color: var(--auth-danger); }
    .msg.success { color: var(--auth-ok); }

    .auth-footer { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--auth-muted); padding: 0 4px; }
    .status-online { display: inline-flex; align-items: center; gap: 7px; }
    .status-dot { width: 7px; height: 7px; background: var(--auth-ok); border-radius: 50%; }

    @media (max-height: 520px) and (orientation: landscape) and (min-width: 640px) {
      #auth-container { max-width: 760px; display: grid; grid-template-columns: 1fr 1fr; align-items: center; gap: 28px; padding: 16px 24px; }
      .brand { flex-direction: column; align-items: flex-start; }
      .auth-footer { grid-column: 1; grid-row: 1; align-self: end; }
      .brand { grid-column: 1; grid-row: 1; align-self: start; }
      .auth-card { grid-column: 2; grid-row: 1 / span 2; padding: 18px; }
      .auth-sub { display: none; }
      .auth-heading { margin-bottom: 12px; }
      .tabs { margin-bottom: 14px; }
      .input-group { margin-bottom: 10px; }
      .input-wrapper, .btn-submit { height: 42px; }
    }

    /* --- UI LOBBY & GAME --- */
    #game-ui { display: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0; pointer-events: none; }
    
    /* Top HUD (Kiri Atas) */
    #top-hud { position: absolute; top: 12px; left: 12px; z-index: 10; display: flex; gap: 7px; align-items: center; pointer-events: auto; }
    #btn-profile { display: flex; align-items: center; gap: 6px; background: rgba(8,14,28,0.82); padding: 6px 10px; border-radius: 14px; color: white; font-weight: bold; font-family: sans-serif; font-size: 13px; cursor: pointer; border: 1px solid rgba(255,255,255,.28); transition: 0.2s; }
    #btn-profile:active { transform: scale(0.95); }
    #hud-verified { display: none; width: 18px; height: 18px; background: #1DA1F2; border-radius: 50%; align-items: center; justify-content: center; font-size: 12px; color: white; }

    /* Koin (Kanan Atas) */
    #coin-hud { position: static; z-index: 10; background: rgba(8,14,28,0.82); padding: 6px 9px; border-radius: 12px; color: #ffd700; font-weight: bold; font-family: sans-serif; font-size: 12px; border: 1px solid rgba(255,215,0,.65); display: flex; align-items: center; gap: 4px; pointer-events: auto; }
    #coin-icon { font-size: 14px; }

    /* Modal Profil */
    #profile-modal { position: absolute; top: 60px; left: 15px; background: #22222e; border: 1px solid #444; border-radius: 12px; padding: 20px; color: white; z-index: 20; width: 250px; box-shadow: 0 5px 20px rgba(0,0,0,0.5); pointer-events: auto; display: none; }
    #profile-modal h3 { margin: 0 0 10px 0; color: #e0aaff; border-bottom: 1px solid #444; padding-bottom: 5px; display: flex; justify-content: space-between; }
    #close-modal { cursor: pointer; color: #ff3333; font-weight: bold; }
    #profile-modal p { margin: 5px 0; font-size: 14px; color: #ccc; }
    #profile-modal .dev-badge { color: #1DA1F2; font-weight: bold; }
    .btn-logout { width: 100%; padding: 10px; margin-top: 15px; background: #ff3333; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-family: sans-serif; }

    /* --- UI SHOP MODAL --- */
    #shop-modal { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #1a1a24; border: 2px solid #9d4edd; border-radius: 15px; width: 90%; max-width: 600px; padding: 20px; z-index: 50; display: none; flex-direction: column; pointer-events: auto; box-shadow: 0 0 30px rgba(157,78,221,0.3); max-height: 80vh; overflow-y: auto; }
    #shop-modal h2 { margin: 0 0 15px 0; text-align: center; color: #e0aaff; font-family: 'Rajdhani', sans-serif; letter-spacing: 2px; }
    .shop-tabs { display: flex; gap: 5px; margin-bottom: 15px; flex-wrap: wrap; justify-content: center; }
    .shop-tab-btn { padding: 8px 15px; background: #333; color: white; border: none; border-radius: 8px; cursor: pointer; font-family: sans-serif; font-weight: bold; }
    .shop-tab-btn.active { background: #9d4edd; }
    .shop-items { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
    .shop-item { background: #22222e; border: 1px solid #444; border-radius: 10px; padding: 15px; text-align: center; display: flex; flex-direction: column; justify-content: space-between; }
    .shop-item .color-preview { width: 50px; height: 50px; border-radius: 50%; margin: 0 auto 10px auto; border: 2px solid #fff; }
    .shop-item .item-name { font-weight: bold; font-size: 14px; margin-bottom: 5px; font-family: sans-serif; }
    .shop-item .item-price { color: #ffd700; font-size: 14px; font-weight: bold; margin-bottom: 10px; font-family: sans-serif; }
    .shop-buy-btn { background: #00ff00; color: black; border: none; padding: 8px; border-radius: 6px; font-weight: bold; cursor: pointer; font-family: sans-serif; width: 100%; }
    .shop-buy-btn:disabled { background: #555; color: #999; cursor: not-allowed; }
    .btn-close-shop { position: absolute; top: 15px; right: 20px; font-size: 20px; font-weight: bold; color: #ff3333; cursor: pointer; }

    #vault-modal { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:#151f33; border:1px solid #42d9ff; border-radius:15px; width:90%; max-width:600px; padding:18px; z-index:51; display:none; flex-direction:column; pointer-events:auto; box-shadow:0 0 28px rgba(66,217,255,.22); max-height:80vh; overflow-y:auto; }
    #vault-modal h2 { margin:0 0 14px; text-align:center; color:#8be8ff; letter-spacing:2px; }
    .vault-tabs { display:flex; gap:5px; margin-bottom:14px; flex-wrap:wrap; justify-content:center; }
    .vault-tab-btn { padding:8px 13px; background:#293957; color:white; border:0; border-radius:8px; font-weight:bold; }
    .vault-tab-btn.active { background:#1685a8; }
    .inventory-empty { grid-column:1/-1; padding:24px 12px; text-align:center; color:#aab7cc; background:rgba(255,255,255,.05); border-radius:10px; }
    .owned-label { color:#6ee7b7!important; }
    #btn-vault { position:absolute; left:12px; top:50%; transform:translateY(-50%); z-index:12; width:58px; min-height:58px; border:1px solid rgba(255,255,255,.45); border-radius:14px; background:rgba(12,24,43,.88); color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; font:700 11px sans-serif; pointer-events:auto; }
    #btn-vault span:first-child { font-size:22px; }

    /* Tombol Shop & Mulai (Kanan Bawah) */
    #bottom-controls { position: absolute; bottom: 18px; right: 18px; display: flex; gap: 10px; align-items: flex-end; z-index: 10; pointer-events: auto; }
    #btn-shop { width: 58px; height: 58px; background: linear-gradient(135deg, #ffd700, #ff8c00); color: black; border: 3px solid white; border-radius: 50%; font-size: 23px; display: flex; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 0 15px rgba(255, 215, 0, 0.5); }
    #btn-shop:active { transform: scale(0.95); }
    #btn-start-game { width: 104px; height: 52px; background: #00ff00; color: black; border: 3px solid white; border-radius: 15px; font-family: 'Rajdhani', sans-serif; font-size: 20px; font-weight: bold; display: flex; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 0 20px rgba(0, 255, 0, 0.5); }
    #btn-start-game:active { transform: scale(0.95); }

    @media (max-width: 700px) { #btn-profile {font-size:11px;padding:5px 7px} #coin-hud{font-size:11px;padding:5px 7px} #btn-vault{left:8px;width:50px;min-height:52px} #room-panel{right:7px;width:min(32vw,210px);font-size:11px;padding:7px} #room-panel.rp-collapsed{max-width:32vw} #bottom-controls{right:10px;bottom:10px;gap:7px} #btn-shop{width:48px;height:48px;font-size:19px} #btn-start-game{width:88px;height:46px;font-size:17px} #chat-container{top:58px;left:9px;width:210px} }

    /* Kontrol Game */
    #in-game-controls { display: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0; pointer-events: none; }
    #joystick-area { position: absolute; bottom: 20px; left: 20px; width: 160px; height: 160px; z-index: 5; touch-action: none; pointer-events: auto; }
    #joystick-zone { position: absolute; bottom: 20px; left: 20px; width: 120px; height: 120px; background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255, 255, 255, 0.4); border-radius: 50%; pointer-events: none; }
    #joystick-knob { position: absolute; top: 50%; left: 50%; width: 50px; height: 50px; background: rgba(255, 255, 255, 0.7); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }
    #btn-jump { position: absolute; bottom: 40px; right: 40px; width: 80px; height: 80px; background: rgba(0, 255, 100, 0.6); border: 2px solid rgba(255, 255, 255, 0.8); border-radius: 50%; color: white; font-weight: bold; display: flex; align-items: center; justify-content: center; user-select: none; font-size: 18px; touch-action: none; z-index: 5; cursor: pointer; pointer-events: auto; font-family: sans-serif;}
    #btn-jump:active { background: rgba(0, 255, 100, 0.9); transform: scale(0.95); }
    #btn-exit-lobby { display: none; position: absolute; top: 10px; right: 10px; z-index: 40; height: 32px; padding: 0 11px; align-items: center; gap: 4px; background: rgba(8,14,28,0.82); color: #fff; border: 1px solid rgba(255,255,255,.45); border-radius: 10px; font: 700 12px sans-serif; cursor: pointer; pointer-events: auto; touch-action: manipulation; }
    #btn-exit-lobby:active { transform: scale(0.95); background: rgba(255,59,59,.85); }
    #btn-run { position: absolute; bottom: 40px; right: 140px; width: 70px; height: 70px; background: rgba(255, 59, 59, 0.6); border: 2px solid rgba(255, 255, 255, 0.8); border-radius: 50%; color: white; font-weight: bold; display: flex; align-items: center; justify-content: center; user-select: none; touch-action: none; z-index: 5; cursor: pointer; pointer-events: auto; font-family: sans-serif;}
    #btn-run:active { background: rgba(255, 59, 59, 0.9); transform: scale(0.95); }

    /* Overlay Game Over */
    #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; flex-direction: column; justify-content: center; align-items: center; color: white; font-family: sans-serif; text-align: center; z-index: 30; pointer-events: auto; }
    #overlay h1 { margin: 0 0 10px 0; font-size: 40px; }
    #overlay p { margin: 0 0 20px 0; font-size: 18px; }
    #overlay button { padding: 10px 30px; font-size: 20px; background: #ff4c00; color: white; border: none; border-radius: 8px; font-weight: bold; }

    /* Overlay Putar HP */
    #rotate-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #1a1a24; color: white; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; transition: opacity 0.3s; }
    #rotate-overlay .icon { font-size: 60px; margin-bottom: 20px; animation: rotate 2s infinite ease-in-out; }
    @keyframes rotate { 0% { transform: rotate(0deg); } 50% { transform: rotate(-90deg); } 100% { transform: rotate(0deg); } }
    @media (orientation: landscape) { #rotate-overlay { display: none !important; } }

    /* Chat */
    #chat-container { position: absolute; top: 70px; left: 15px; width: 280px; z-index: 15; pointer-events: auto; display: flex; flex-direction: column; }
    #chat-toggle { background: #9d4edd; color: white; border: 2px solid white; padding: 6px 12px; border-radius: 20px; font-weight: bold; cursor: pointer; align-self: flex-start; margin-bottom: 5px; font-family: sans-serif; font-size: 13px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    #chat-box { background: rgba(0,0,0,0.85); border: 1px solid #555; border-radius: 10px; display: none; flex-direction: column; height: 180px; backdrop-filter: blur(5px); margin-top: 5px;}
    #chat-messages { flex: 1; overflow-y: auto; padding: 10px; font-size: 13px; display: flex; flex-direction: column; gap: 5px; }
    .chat-msg { word-wrap: break-word; line-height: 1.2; }
    .chat-msg .name { font-weight: bold; color: #e0aaff; }
    .chat-msg .name.dev { color: #1DA1F2; }
    .chat-msg .text { color: #ddd; }
    #chat-input-area { display: flex; border-top: 1px solid #444; padding: 5px; }
    #chat-input { flex: 1; background: transparent; border: none; color: white; padding: 5px; outline: none; font-family: sans-serif; font-size: 13px; }
    #chat-send { background: #9d4edd; border: none; color: white; padding: 5px 10px; border-radius: 5px; font-weight: bold; cursor: pointer; }

    /* --- NOTIFIKASI CUSTOM (TOAST) --- */
    #custom-toast {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.8);
      background: rgba(20, 20, 30, 0.95); border: 2px solid #9d4edd; border-radius: 15px;
      padding: 20px 40px; color: white; font-family: 'Rajdhani', sans-serif; font-size: 24px; font-weight: bold;
      z-index: 99999; display: none; opacity: 0; transition: all 0.3s ease; text-align: center;
      box-shadow: 0 0 20px rgba(157, 78, 221, 0.6); pointer-events: none;
    }
    #custom-toast.show { display: block; opacity: 1; transform: translate(-50%, -50%) scale(1); }

    /* Splash/loading awal */
    #startup-loading {
      position: fixed; inset: 0; z-index: 200000;
      display: flex; flex-direction: column; justify-content: flex-end;
      align-items: center; padding: 0 7vw max(28px, env(safe-area-inset-bottom));
      background: radial-gradient(circle at 50% 30%, #3a1363 0%, #090512 75%);
      color: #fff; text-align: center; font-family: 'Rajdhani', sans-serif;
      transition: opacity .45s ease, visibility .45s ease;
    }
    #startup-loading .startup-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center; z-index: 0; }
    #startup-loading::before {
      content: ""; position: absolute; inset: 0; z-index: 1;
      background: linear-gradient(180deg, rgba(5,0,15,.08) 25%, rgba(5,0,15,.18) 55%, rgba(5,0,15,.94) 100%);
    }
    #startup-loading .startup-content { position: relative; z-index: 2; width: min(100%, 520px); }
    #startup-loading .startup-title { font-size: clamp(22px, 6vw, 34px); font-weight: 700; letter-spacing: 3px; text-shadow: 0 0 18px #bd45ff; }
    #startup-loading .startup-sub { margin: 3px 0 18px; color: #e8caff; font-size: 13px; letter-spacing: 2px; }
    #startup-loading .startup-track { width: 100%; height: 12px; padding: 2px; border: 1px solid #d66aff; border-radius: 20px; background: rgba(10,3,20,.8); box-shadow: 0 0 16px #a52cff; overflow: hidden; }
    #startup-loading .startup-bar { width: 8%; height: 100%; border-radius: 20px; background: linear-gradient(90deg,#8b2be2,#e6a0ff); box-shadow: 0 0 12px #d46aff; transition: width .22s ease; }
    #startup-loading .startup-status { margin-top: 10px; font-size: 14px; color: #f2dcff; }
    #startup-loading.is-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    #rotate-overlay { display: none !important; }

  
    /* =====================================================================
       TEMA LOBBY "sticker arcade": warna solid, garis tepi tebal gelap,
       bayangan keras di bawah, font bulat tebal. Tanpa gradasi/glow/neon.
       Tombol utama (MULAI, toko, vault, dll.) ditema oleh lobbyui.js.
       ===================================================================== */
    :root { --ink:#1b1233; --cream:#fff4d6; --yellow:#ffc21a; --green:#3ddc84; --blue:#4da3ff; --pink:#ff6b9a; --red:#ff5a4d; --ui-font:'Baloo 2','Trebuchet MS',system-ui,sans-serif; }

    /* HUD kiri atas */
    #coin-hud { background:var(--yellow); color:var(--ink); border:3px solid var(--ink); border-radius:12px; box-shadow:0 4px 0 var(--ink); font-family:var(--ui-font); font-weight:800; font-size:14px; padding:4px 10px; gap:6px; }
    #coin-icon { font-size:0; width:16px; height:16px; border-radius:50%; background:#fff3a8; border:2.5px solid var(--ink); box-shadow:inset 0 0 0 2px #e0a800; display:inline-block; }
    #hud-verified { border:2px solid var(--ink); }

    /* Jendela (profil, toko, vault) */
    #profile-modal, #shop-modal, #vault-modal { background:var(--cream); color:var(--ink); border:3px solid var(--ink); border-radius:18px; box-shadow:0 6px 0 var(--ink); font-family:var(--ui-font); }
    #profile-modal h3 { color:var(--ink); border-bottom:3px solid var(--ink); padding-bottom:8px; font-family:var(--ui-font); font-weight:800; letter-spacing:.05em; align-items:center; }
    #profile-modal p { color:#4a3d6b; font-size:15px; }
    #profile-modal .dev-badge { color:#0b72c9; }
    #shop-modal h2, #vault-modal h2 { color:var(--ink); font-family:var(--ui-font); font-weight:800; letter-spacing:.08em; }
    .btn-logout { background:var(--red); color:#fff; border:3px solid var(--ink); border-radius:12px; box-shadow:0 4px 0 var(--ink); font-family:var(--ui-font); font-weight:800; letter-spacing:.05em; }
    .btn-logout:active { transform:translateY(3px); box-shadow:0 1px 0 var(--ink); }

    /* Tombol tutup (X digambar CSS, bukan emoji) */
    .btn-close-shop, #close-modal { position:relative; display:inline-block; width:34px; height:34px; font-size:0; background:var(--red); border:3px solid var(--ink); border-radius:10px; box-shadow:0 3px 0 var(--ink); color:transparent; flex:none; }
    .btn-close-shop { position:absolute; top:14px; right:16px; }
    .btn-close-shop::before, .btn-close-shop::after, #close-modal::before, #close-modal::after { content:''; position:absolute; left:50%; top:50%; width:16px; height:3.5px; margin:-1.75px 0 0 -8px; background:#fff; border-radius:2px; }
    .btn-close-shop::before, #close-modal::before { transform:rotate(45deg); }
    .btn-close-shop::after, #close-modal::after { transform:rotate(-45deg); }
    .btn-close-shop:active, #close-modal:active { transform:translateY(2px); box-shadow:0 1px 0 var(--ink); }

    /* Kartu item toko / vault */
    .shop-item { background:#fff; color:var(--ink); border:3px solid var(--ink); border-radius:14px; box-shadow:0 4px 0 var(--ink); }
    .shop-item .color-preview { border:3px solid var(--ink); }
    .shop-item .item-name { color:var(--ink); font-family:var(--ui-font); font-weight:800; }
    .shop-item .item-price { color:#a35f00; font-family:var(--ui-font); font-weight:800; }
    .shop-item .owned-label { color:#14804a !important; }
    .inventory-empty { background:rgba(27,18,51,.07); color:#6b5d8a; }

    /* Chat */
    #chat-toggle { background:var(--blue); color:var(--ink); border:3px solid var(--ink); border-radius:12px; box-shadow:0 4px 0 var(--ink); font-family:var(--ui-font); font-weight:800; font-size:14px; padding:4px 14px; }
    #chat-toggle:active { transform:translateY(3px); box-shadow:0 1px 0 var(--ink); }
    #chat-box { background:var(--cream); border:3px solid var(--ink); border-radius:14px; box-shadow:0 4px 0 var(--ink); backdrop-filter:none; -webkit-backdrop-filter:none; }
    .chat-msg .name { color:#b4236b; }
    .chat-msg .name.dev { color:#0b72c9; }
    .chat-msg .text { color:#2b2147; }
    #chat-input-area { border-top:3px solid var(--ink); }
    #chat-input { color:var(--ink); font-family:var(--ui-font); font-weight:600; }
    #chat-input::placeholder { color:#8a7fa8; }
    #chat-send { background:var(--green); color:var(--ink); border:2px solid var(--ink); border-radius:8px; font-family:var(--ui-font); font-weight:800; }

    /* Notifikasi tengah layar */
    #custom-toast { background:var(--cream); color:var(--ink); border:3px solid var(--ink); border-radius:16px; box-shadow:0 6px 0 var(--ink); font-family:var(--ui-font); font-weight:800; }

    /* Kontrol main */
    #btn-jump { background:var(--green); color:var(--ink); border:3px solid var(--ink); box-shadow:0 5px 0 var(--ink); font-family:var(--ui-font); font-weight:800; letter-spacing:.04em; }
    #btn-jump:active { background:var(--green); transform:translateY(4px); box-shadow:0 1px 0 var(--ink); }
    #btn-run { background:var(--red); color:#fff; border:3px solid var(--ink); box-shadow:0 5px 0 var(--ink); font-family:var(--ui-font); font-weight:800; letter-spacing:.04em; }
    #btn-run:active { background:var(--red); transform:translateY(4px); box-shadow:0 1px 0 var(--ink); }
    #joystick-zone { background:rgba(27,18,51,.38); border:3px solid rgba(255,255,255,.85); }
    #joystick-knob { background:var(--cream); border:3px solid var(--ink); }

    /* Layar menang/kalah */
    #overlay { background:rgba(27,18,51,.9); }
    #overlay h1 { font-family:var(--ui-font); font-weight:800; font-size:clamp(34px,9vw,56px); letter-spacing:.04em; text-shadow:0 4px 0 var(--ink); }
    #overlay p { font-family:var(--ui-font); font-weight:600; }
    #overlay button { background:var(--yellow); color:var(--ink); border:3px solid var(--ink); border-radius:14px; box-shadow:0 5px 0 #8a6200; font-family:var(--ui-font); font-weight:800; letter-spacing:.05em; }
    #overlay button:active { transform:translateY(4px); box-shadow:0 1px 0 #8a6200; }
  </style>
</head>
<body>
  <div id="startup-loading" aria-label="Memuat PARKOUR 3D">
    <img class="startup-bg" id="startup-bg" alt="" decoding="async" fetchpriority="high" referrerpolicy="no-referrer"
         src="./loading.jpg">
    <script>
      // Coba beberapa sumber foto berurutan sampai ada yang berhasil dimuat
      (function () {
        var img = document.getElementById('startup-bg');
        var srcs = [
          './loading.jpg',
          'https://wsrv.nl/?url=files.catbox.moe/0xw03u.jpg',
          'https://images.weserv.nl/?url=files.catbox.moe/0xw03u.jpg',
          'https://files.catbox.moe/0xw03u.jpg'
        ], i = 0, timer;
        function next() {
          clearTimeout(timer);
          i++;
          if (i >= srcs.length) { img.style.display = 'none'; return; }
          img.src = srcs[i];
          timer = setTimeout(function () { if (!img.complete || !img.naturalWidth) next(); }, 4000);
        }
        img.onerror = next;
        img.onload = function () { clearTimeout(timer); img.style.display = ''; };
        img.src = srcs[0];
        timer = setTimeout(function () { if (!img.complete || !img.naturalWidth) next(); }, 2500);
      })();
    </script>
    <div class="startup-content">
      <div class="startup-title">PARKOUR 3D</div>
      <div class="startup-sub">DEVELOPED BY PUTZZDEV</div>
      <div class="startup-track"><div class="startup-bar" id="startup-bar"></div></div>
      <div class="startup-status" id="startup-status">Menyiapkan permainan...</div>
    </div>
  </div>

  <!-- LAYAR LOGIN / DAFTAR -->
  <div id="auth-container">
    <div class="brand">
      <div class="brand-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5,5.5c1.1,0,2-0.9,2-2s-0.9-2-2-2s-2,0.9-2,2S12.4,5.5,13.5,5.5z M9.8,8.9L7,23h2.1l1.8-8l2.1,2v6h2v-7.5l-2.1-2l0.6-3C14.8,12,16.8,13,19,13v-2c-1.9,0-3.5-1-4.3-2.4l-1-1.6c-0.4-0.6-1-1-1.7-1c-0.3,0-0.5,0.1-0.8,0.1L6,8.3V13h2V9.6l1.8-0.7z"/></svg></div>
      <div class="brand-text">
        <h1>Parkour 3D</h1>
        <p>Dikembangkan oleh PutzzDev</p>
      </div>
    </div>

    <input type="radio" name="tabs" id="tab1" checked>
    <input type="radio" name="tabs" id="tab2">

    <div class="auth-card">
      <div class="tabs">
        <span class="tab-indicator"></span>
        <label class="tab-label" for="tab1">Masuk</label>
        <label class="tab-label" for="tab2">Daftar</label>
      </div>

      <div class="form-container">
        <!-- LOGIN -->
        <div class="form-box" id="form-login">
          <div class="input-group">
            <label for="login-username">Username</label>
            <div class="input-wrapper">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
              <input type="text" id="login-username" placeholder="Masukkan username" maxlength="15" autocomplete="off" autocapitalize="none" spellcheck="false">
            </div>
          </div>
          <div class="input-group">
            <label for="login-pin">PIN</label>
            <div class="input-wrapper">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10.5" width="16" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>
              <input type="password" id="login-pin" placeholder="6 digit angka" maxlength="6" inputmode="numeric" autocomplete="off">
              <button type="button" class="toggle-pw" data-target="login-pin" aria-label="Tampilkan PIN">
                <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 5.1A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.3 4.2M6.6 6.6A17 17 0 0 0 2 12s3.6 7 10 7a9.6 9.6 0 0 0 4.3-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
              </button>
            </div>
          </div>
          <button class="btn-submit" id="btn-login" type="button">Masuk ke Lobi</button>
          <div class="msg" id="login-msg"></div>
        </div>

        <!-- DAFTAR -->
        <div class="form-box" id="form-register">
          <div class="input-group">
            <label for="reg-username">Username</label>
            <div class="input-wrapper">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
              <input type="text" id="reg-username" placeholder="Pilih username" maxlength="15" autocomplete="off" autocapitalize="none" spellcheck="false">
            </div>
            <p class="field-hint">Maksimal 15 karakter</p>
          </div>
          <div class="input-group">
            <label for="reg-pin">PIN</label>
            <div class="input-wrapper">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10.5" width="16" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>
              <input type="password" id="reg-pin" placeholder="6 digit angka" maxlength="6" inputmode="numeric" autocomplete="off">
              <button type="button" class="toggle-pw" data-target="reg-pin" aria-label="Tampilkan PIN">
                <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 5.1A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.3 4.2M6.6 6.6A17 17 0 0 0 2 12s3.6 7 10 7a9.6 9.6 0 0 0 4.3-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
              </button>
            </div>
          </div>
          <div class="input-group">
            <label for="reg-pin-confirm">Konfirmasi PIN</label>
            <div class="input-wrapper">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg>
              <input type="password" id="reg-pin-confirm" placeholder="Ulangi PIN" maxlength="6" inputmode="numeric" autocomplete="off">
              <button type="button" class="toggle-pw" data-target="reg-pin-confirm" aria-label="Tampilkan PIN">
                <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 5.1A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.3 4.2M6.6 6.6A17 17 0 0 0 2 12s3.6 7 10 7a9.6 9.6 0 0 0 4.3-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
              </button>
            </div>
          </div>
          <button class="btn-submit" id="btn-register" type="button">Buat Akun</button>
          <div class="msg" id="reg-msg"></div>
        </div>
      </div>
    </div>

    <div class="auth-footer">
      <span class="status-online"><span class="status-dot"></span>Server aktif</span>
      <span>v1.0</span>
    </div>

    <script>
      document.querySelectorAll('.toggle-pw').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var input = document.getElementById(btn.getAttribute('data-target'));
          if (!input) return;
          var show = input.type === 'password';
          input.type = show ? 'text' : 'password';
          btn.classList.toggle('is-visible', show);
          btn.setAttribute('aria-label', show ? 'Sembunyikan PIN' : 'Tampilkan PIN');
        });
      });
    </script>
  </div>

  <!-- LAYAR GAME 3D -->
  <div id="game-ui">
    
    <div id="top-hud">
      <div id="btn-profile">
        <span id="hud-username">Player</span>
        <div id="hud-verified">✔</div>
      </div>
      <div id="coin-hud">
      <span id="coin-icon">🪙</span>
      <span id="coin-amount">0</span>
      </div>
    </div>
    <button id="btn-vault" type="button" style="display:none"><span>🎒</span><span>VAULT</span></button>

    <div id="chat-container">
      <button id="chat-toggle">Chat Global</button>
      <div id="chat-box">
        <div id="chat-messages"></div>
        <div id="chat-input-area">
          <input type="text" id="chat-input" placeholder="Ketik pesan..." maxlength="50" autocomplete="off">
          <button id="chat-send">Kirim</button>
        </div>
      </div>
    </div>

    <div id="profile-modal">
      <h3>INFO AKUN <span id="close-modal">✖</span></h3>
      <p>Username: <b id="modal-username">Player</b></p>
      <p>Status: <span id="modal-status" class="dev-badge">Player Biasa</span></p>
      <button class="btn-logout" id="btn-logout">LOGOUT</button>
    </div>

    <div id="shop-modal">
      <span class="btn-close-shop" id="close-shop">✖</span>
      <h2>TOKO KARAKTER</h2>
      <div class="shop-tabs" id="shop-tabs-container">
        <button class="shop-tab-btn active" data-cat="baju">Baju</button>
        <button class="shop-tab-btn" data-cat="celana">Celana</button>
        <button class="shop-tab-btn" data-cat="sepatu">Sepatu</button>
        <button class="shop-tab-btn" data-cat="efek">Efek</button>
      </div>
      <div class="shop-items" id="shop-items-container"></div>
    </div>

    <div id="vault-modal">
      <span class="btn-close-shop" id="close-vault">✖</span>
      <h2>KOLEKSI</h2>
      <div class="vault-tabs">
        <button class="vault-tab-btn active" data-cat="baju">Baju</button>
        <button class="vault-tab-btn" data-cat="celana">Celana</button>
        <button class="vault-tab-btn" data-cat="sepatu">Sepatu</button>
        <button class="vault-tab-btn" data-cat="efek">Efek</button>
        <button class="vault-tab-btn" data-cat="aksesoris">Aksesoris</button>
      </div>
      <div class="shop-items" id="vault-items-container"></div>
    </div>

    <div id="bottom-controls">
      <div id="btn-shop" style="display: none;">🛒</div>
      <div id="btn-start-game" style="display: flex;">MULAI</div>
    </div>

    <button id="btn-exit-lobby" type="button" title="Keluar ke lobby">🚪 Lobby</button>
    <div id="in-game-controls">
      <div id="joystick-area"><div id="joystick-zone"><div id="joystick-knob"></div></div></div>
      <div id="btn-jump">LOMPAT</div>
      <div id="btn-run">LARI</div>
    </div>

    <div id="overlay">
      <h1 id="overlay-title">GAME OVER</h1>
      <p id="overlay-desc">Kamu gagal!</p>
      <button id="btn-restart" type="button">COBA LAGI</button>
    </div>
  </div>

  <!-- Toast Element -->
  <div id="custom-toast"></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module" src="./main.js"></script>
</body>
</html>
